name: go-server-dev
services:
  - name: go-server
    source_dir: /
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true
    dockerfile_path: /Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    envs:
      # Environment variables will be added here by the generator script
      # from .env.development file

databases:
  - name: db
    engine: PG
    version: "15"
    production: false
    cluster_name: go-server-dev-cluster
    db_name: golang_arch_dev
    db_user: golang_arch

domains:
  - domain: api.dev.go-server.app
    type: PRIMARY
    zone: dev.go-server.app

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: go-server
      match:
        path:
          prefix: /

region: sgp 