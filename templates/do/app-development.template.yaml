name: workluv-dev
services:
  - name: workluv
    source_dir: /
    github:
      repo: mrardyan/workluv-server
      branch: develop
      deploy_on_push: true
    dockerfile_path: /Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health/simple
    envs:
      # Environment variables will be added here by the generator script
      # from .env.development file

databases:
  - name: db
    engine: PG
    version: "15"
    production: true
    cluster_name: app-138c05d6-83b3-41a1-b7ca-5e7de4ee2272
    db_name: db
    db_user: db

domains:
  - domain: api.dev.workluv.app
    type: PRIMARY
    zone: dev.workluv.app

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: workluv
      match:
        path:
          prefix: /

region: sgp 