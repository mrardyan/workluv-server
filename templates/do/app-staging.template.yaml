name: workluv-staging
services:
  - name: workluv
    source_dir: /
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: staging
      deploy_on_push: true
    dockerfile_path: /Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health/simple
    envs:
      # Environment variables will be added here by the generator script
      # from .env.staging file

databases:
  - name: db
    engine: PG
    version: "15"
    production: false
    cluster_name: workluv-staging-cluster
    db_name: golang_arch_staging
    db_user: golang_arch

domains:
  - domain: api.staging.workluv.app
    type: PRIMARY
    zone: staging.workluv.app

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: workluv
      match:
        path:
          prefix: /

region: sgp 