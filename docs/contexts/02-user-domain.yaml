            return_type: "[]Account"
            error_handling: "Returns empty slice if no accounts found"
          - name: "BulkUpdateStatus"
            description: "Updates status for multiple accounts"
            parameters:
              - name: "account_ids"
                type: "[]UUID"
              - name: "status"
                type: "string"
            return_type: "integer"
